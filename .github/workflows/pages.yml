name: Build and Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Sync Gallery Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HF_SPACE: removeshort/removeshort-AIGC-Studio

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Read Hugging Face gallery index
        run: |
          set -euo pipefail
          HF_SPACE="${HF_SPACE}" node scripts/sync-hf-gallery.js

      - name: Build Optimized Site
        run: |
          set -euo pipefail
          SKIP_LOCAL_GALLERY_ASSETS=1 python scripts/build-publish.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
