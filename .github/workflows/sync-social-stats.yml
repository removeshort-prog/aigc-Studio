name: Sync Social Stats

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-social-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh follower counts
        run: node scripts/generate-social-stats.js

      - name: Commit updated counts
        run: |
          if git diff --quiet -- generated-social-stats.js; then
            echo "Social stats are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-social-stats.js
          git commit -m "Sync social stats"
          git push
